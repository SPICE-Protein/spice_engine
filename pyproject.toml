[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "spice-engine"
# Single source of truth: maturin derives the wheel version from Cargo.toml
# (the static "1.0.0" here had silently diverged from the crate at 1.3.x).
dynamic = ["version"]
description = "SPICE protein adaptive evolution — Rust MD engine (PyO3 bindings)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.maturin]
module-name = "spice_engine"
features = ["python"]
bindings = "pyo3"
