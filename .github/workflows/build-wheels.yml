# Build CPython wheels for all major platforms on GitHub Actions, then upload
# them as build artifacts (login required to download — fine for private use
# until we publish publicly).
#
# Why both SSH->HTTPS rewrite: `Cargo.toml` points at the SPICE-Protein forks
# via `ssh://` (matches local dev), but CI runners have no SSH key. The forks are
# public, so we rewrite to HTTPS which needs no credentials. This relies on
# `.cargo/config.toml` (git-fetch-with-cli = true) so cargo uses the git CLI,
# which honours `url.<base>.insteadOf`.
#
# Trigger: push to main/master, tag `v*`, or manual "Run workflow".
name: build-wheels

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  # Belt-and-suspenders; .cargo/config.toml already sets this.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: wheel (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — Google Colab, most cloud CPUs, cheap GPUs
          - os: ubuntu-latest
            target: x86_64
          # Linux arm64 — ARM cloud, Jetson, Apple-silicon cloud boxes
          - os: ubuntu-latest
            target: aarch64
          # macOS arm64 (Apple Silicon) — local dev
          - os: macos-14
            target: aarch64
          # Windows x86_64
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Rewrite SSH git deps to HTTPS (public forks, no creds needed)
        shell: bash
        run: |
          git config --global url."https://github.com/SPICE-Protein/".insteadOf "ssh://git@github.com/SPICE-Protein/"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          # manylinux:auto → manylinux2014/musllinux wheels; zig helps cross-compile
          # the aarch64 target when any C dependency needs compiling.
          manylinux: auto
          zig: true

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spice_engine-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
