# Build CPython wheels for the platforms we actually ship, then upload them as
# build artifacts (login required to download — fine for private use until we
# publish publicly). On tags, wheels are also attached to a GitHub Release.
#
# Python matrix: 3.12 (Colab / most cloud runtimes) + 3.11 (Kaggle). The wheel's
# cp tag MUST match the runtime Python — otherwise pip rejects it with
# "not a supported wheel on this platform" (e.g. a cp39 wheel on a 3.12 runtime).
#
# Git deps: `Cargo.toml` uses `https://` URLs to the PUBLIC SPICE-Protein forks
# (ewald/dynamics), so CI needs no credentials and no SSH->HTTPS rewrite.
# linux/aarch64 is deferred (maturin cross-build can't find an aarch64 CPython
# reliably); re-add with a native ARM runner or proper QEMU/manylinux when needed.
#
# Trigger: push to main/master, tag `v*`, or manual "Run workflow".
name: build-wheels

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  # Belt-and-suspenders; .cargo/config.toml already sets this.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: wheel (${{ matrix.os }} / ${{ matrix.target }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — Google Colab (3.12) / Kaggle (3.11)
          - os: ubuntu-latest
            target: x86_64
            python: "3.12"
            interpreter: python3.12
          - os: ubuntu-latest
            target: x86_64
            python: "3.11"
            interpreter: python3.11
          # NOTE: linux/aarch64 (Jetson, ARM cloud) is deferred — maturin's
          # cross-build can't find an aarch64 CPython reliably; re-add with the
          # proper manylinux docker/QEMU or a native ARM runner when needed.
          # macOS arm64 (Apple Silicon) — local dev
          - os: macos-14
            target: aarch64
            python: "3.12"
            interpreter: python
          # Windows x86_64
          - os: windows-latest
            target: x86_64
            python: "3.12"
            interpreter: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # ⚠️ 必须显式 --interpreter：manylinux 容器默认 python3 是 cp39，
          # 不钉 interpreter 会打出 cp39 wheel（pip 拒绝装到 3.12/3.11）。
          args: --release --interpreter ${{ matrix.interpreter }} --out dist
          manylinux: auto

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          # 名字带 Python 版本：cp312 给 Colab，cp311 给 Kaggle
          name: spice_engine-${{ matrix.os }}-${{ matrix.target }}-py${{ matrix.python }}
          path: dist
          if-no-files-found: error

  release:
    name: Attach wheels to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.whl
